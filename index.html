<!-- DASHBOARD ADMIN -->
<!-- ========================= -->

<div class="dashboard" id="dashboard">

  <div class="dashboard-sidebar">

    <h2>
      IKHWAN CMS
    </h2>

    <ul>

      <li onclick="showTab('uploadProject')">
        Upload Project
      </li>

      <li onclick="showTab('uploadGallery')">
        Upload Gallery
      </li>

      <li onclick="showTab('uploadBlog')">
        Upload Blog
      </li>

      <li onclick="logoutAdmin()">
        Logout
      </li>

    </ul>

  </div>

  <div class="dashboard-content">

    <!-- Upload Project -->

    <div id="uploadProject" class="tab-content active-tab">

      <h2>Upload Project</h2>

      <input type="text"
      placeholder="Judul Project">

      <input type="file">

      <textarea
      placeholder="Deskripsi"></textarea>

      <button>
        Upload
      </button>

    </div>

    <!-- Upload Gallery -->

    <div id="uploadGallery"
    class="tab-content">

      <h2>Upload Gallery</h2>

      <input type="file" multiple>

      <button>
        Upload Gallery
      </button>

    </div>

    <!-- Upload Blog -->

    <div id="uploadBlog"
    class="tab-content">

      <h2>Upload Blog</h2>

      <input type="text"
      placeholder="Judul Blog">

      <textarea
      placeholder="Isi Artikel"></textarea>

      <button>
        Publish Blog
      </button>

    </div>

  </div>

</div>

<!-- ========================= -->
<!-- STYLE DASHBOARD -->
<!-- ========================= -->

<style>

.admin-btn{
  position:fixed;
  bottom:30px;
  right:30px;
  width:70px;
  height:70px;
  border:none;
  border-radius:50%;
  background:linear-gradient(to right,#38bdf8,#8b5cf6);
  color:white;
  font-size:24px;
  cursor:pointer;
  z-index:999;
  box-shadow:0 10px 30px rgba(56,189,248,.3);
}

.admin-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.admin-box{
  width:90%;
  max-width:400px;
  background:#111827;
  border-radius:30px;
  padding:40px;
  position:relative;
}

.admin-box h2{
  margin-bottom:30px;
}

.admin-box input{
  width:100%;
  padding:16px;
  border:none;
  border-radius:15px;
  margin-bottom:20px;
  background:#1f2937;
  color:white;
}

.admin-box button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:50px;
  background:linear-gradient(to right,#38bdf8,#8b5cf6);
  color:white;
  font-weight:600;
  cursor:pointer;
}

.close-admin{
  position:absolute;
  top:20px;
  right:25px;
  font-size:30px;
  cursor:pointer;
}

.dashboard{
  position:fixed;
  inset:0;
  background:#050816;
  display:none;
  z-index:10000;
}

.dashboard-sidebar{
  width:260px;
  height:100%;
  background:#111827;
  position:absolute;
  left:0;
  top:0;
  padding:40px 25px;
}

.dashboard-sidebar h2{
  margin-bottom:40px;
  color:#38bdf8;
}

.dashboard-sidebar ul{
  list-style:none;
}

.dashboard-sidebar ul li{
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
  background:#1f2937;
  cursor:pointer;
  transition:.3s;
}

.dashboard-sidebar ul li:hover{
  background:#38bdf8;
}

.dashboard-content{
  margin-left:280px;
  padding:50px;
}

.tab-content{
  display:none;
}

.active-tab{
  display:block;
}

.dashboard-content input,
.dashboard-content textarea{
  width:100%;
  padding:18px;
  margin-bottom:20px;
  border:none;
  border-radius:15px;
  background:#111827;
  color:white;
}

.dashboard-content button{
  padding:16px 30px;
  border:none;
  border-radius:50px;
  background:linear-gradient(to right,#38bdf8,#8b5cf6);
  color:white;
  cursor:pointer;
}

</style>

<!-- ========================= -->
<!-- SCRIPT DASHBOARD -->
<!-- ========================= -->

<script>

function openAdmin(){
  document.getElementById('adminModal').style.display='flex';
}

function closeAdmin(){
  document.getElementById('adminModal').style.display='none';
}

function loginAdmin(){

  let username =
  document.getElementById('adminUser').value;

  let password =
  document.getElementById('adminPass').value;

  if(username === 'admin'
  && password === 'Admin123'){

    document.getElementById('adminModal').style.display='none';

    document.getElementById('dashboard').style.display='block';

  }else{

    alert('Login gagal');

  }

}

function logoutAdmin(){

  document.getElementById('dashboard').style.display='none';

}

function showTab(tabId){

  let tabs =
  document.querySelectorAll('.tab-content');

  tabs.forEach(tab=>{
    tab.classList.remove('active-tab');
  });

  document.getElementById(tabId)
  .classList.add('active-tab');

}

</script>
